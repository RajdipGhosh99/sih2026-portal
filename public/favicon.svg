<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" />
  
  <!-- Inner Border Accent -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  
  <!-- Stack / Layer 3 (Bottom) -->
  <path d="M 14 39 L 32 48 L 50 39 L 45 36.5 L 32 43 L 19 36.5 Z" fill="rgba(255,255,255,0.5)" filter="url(#glow)"/>

  <!-- Stack / Layer 2 (Middle) -->
  <path d="M 14 31 L 32 40 L 50 31 L 45 28.5 L 32 35 L 19 28.5 Z" fill="rgba(255,255,255,0.8)" filter="url(#glow)"/>

  <!-- Stack / Layer 1 (Top) -->
  <polygon points="32,16 50,25 32,34 14,25" fill="url(#layerGrad)" filter="url(#glow)"/>

  <!-- AI / Innovation Spark -->
  <path d="M 46 12 Q 46 16 50 16 Q 46 16 46 20 Q 46 16 42 16 Q 46 16 46 12 Z" fill="#fbbf24" />
</svg>
